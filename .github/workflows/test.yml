name: Tests

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

jobs:
  logic-tests:
    name: Logic tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m py_compile custom_components/plant_monitor/*.py
      - name: Install tested Home Assistant dependencies
        run: pip install -r tests/requirements.txt
      - name: Run calculation-engine tests
        run: python tests/test_plant_data.py
      - name: Run species-database tests
        run: python tests/test_species.py
      - name: Validate JSON files
        run: |
          python -c "
          import json, pathlib
          for p in pathlib.Path('.').rglob('*.json'):
              json.loads(p.read_text())
              print('OK:', p)
          "

  end-to-end-tests:
    name: Config flow & frontend end-to-end tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test harness
        run: pip install -r tests/requirements.txt
      - name: Run integration and regression tests
        run: pytest tests -v

  card-tests:
    name: Lovelace card tests (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check custom_components/plant_monitor/www/plant-monitor-card.js
      - name: Install test deps
        working-directory: tests/card
        run: npm ci
      - name: Run card tests
        working-directory: tests/card
        run: npm test
